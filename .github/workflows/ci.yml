# CI на каждый push и pull request, две независимые задачи:
#   test   — lint, сборка, vitest (unit и db) и e2e Playwright на сервисе Postgres;
#   docker — тот путь, которым приложение запускает жюри (ТЗ §4.2.3, §8.2.2):
#            `docker compose up --build` на чистой машине, затем /api/health и страницы.
# Локально Docker может быть недоступен; тот же путь без Docker проверяет
# `npm run check:fresh` (scripts/fresh-instance-check.ts).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rrp
          POSTGRES_PASSWORD: rrp_dev_password
          POSTGRES_DB: robotization_roi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rrp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://rrp:rrp_dev_password@localhost:5432/robotization_roi
      AUTH_SECRET: ci-throwaway-secret-not-for-production
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      # --max-warnings=0 because eslint exits 0 on warnings: without it this step would
      # only catch hard errors, and the repo's findings (unused imports and the like)
      # are all warnings. The tree is at 0/0 today, so this locks that in.
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Без --wait: сервис migrate разовый и завершается, а `up --wait` ждёт, что все сервисы
      # останутся запущенными, и может счесть его выход ошибкой. `up -d` и так дожидается
      # условий depends_on (база здорова, migrate завершился с кодом 0) и падает, если migrate
      # упал.
      - name: Сборка и запуск одной командой
        run: docker compose up -d --build
      - name: Ожидание /api/health (до 240 с)
        run: |
          for i in $(seq 1 48); do
            if curl -fsS --max-time 5 http://localhost:3000/api/health; then
              echo
              echo "/api/health ответил после $(( (i - 1) * 5 )) с ожидания"
              exit 0
            fi
            sleep 5
          done
          echo "/api/health не ответил за 240 с"
          exit 1
      - name: Главная и демо-расчёт отдают 200
        run: |
          curl -fsS --max-time 30 http://localhost:3000/ -o /dev/null
          curl -fsS --max-time 30 http://localhost:3000/demo -o /dev/null
      - name: Диагностика при падении
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs migrate app
      - name: Остановка и удаление данных
        if: always()
        run: docker compose down -v
